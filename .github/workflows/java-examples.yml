name: Verify Java architecture examples
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            petclinic-architectures/pom.xml
            petclinic-adapted/pom.xml
      - name: Verify isolated architecture examples
        run: mvn -B -ntp -f petclinic-architectures/pom.xml verify
      - name: Verify integrated PetClinic and existing web controllers
        run: mvn -B -ntp -f petclinic-adapted/pom.xml -Dtest=ArchitectureIntegrationTest,VisitControllerTests,OwnerControllerTests,PetControllerTests,VetControllerTests,WelcomeControllerTests test
