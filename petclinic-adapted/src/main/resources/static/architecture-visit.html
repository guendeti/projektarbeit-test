<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PetClinic Visit Architekturbeispiele</title>
<style>body{font:18px/1.6 system-ui;max-width:44rem;margin:3rem auto;padding:0 1rem;color:#111}label{display:block;margin:1rem 0}input,select,button{font:inherit;padding:.45rem}button{background:#0064a6;color:white;border:0}output{display:block;white-space:pre-wrap;margin-top:1rem}</style>
<h1>Besuch fÃ¼r ein Haustier erfassen</h1><p>EigenstÃ¤ndiger Java-/Spring-Lehrausschnitt der PetClinic-DomÃ¤ne. Alle Varianten verwenden dieselbe H2-Datenbank. Dies ist keine vollstÃ¤ndige PetClinic.</p>
<form><label>Architektur <select name="architecture"><option>layered</option><option>clean</option><option>hexagonal</option><option>onion</option></select></label>
<label>Owner-ID <input name="ownerId" type="number" required min="1"></label><label>Pet-ID <input name="pet" type="number" required min="1"></label>
<label>Besuchsdatum <input name="date" type="date" required></label><label>Beschreibung <input name="description" required maxlength="255"></label>
<button>Besuch speichern</button></form><output aria-live="polite"></output>
<p><a id="back" href="/owners/find">Zurück zur PetClinic</a></p><script>const params=new URLSearchParams(location.search); for(const key of ["ownerId","petId"]){const input=document.querySelector(`[name="${key === "petId" ? "pet" : key}"]`);if(params.has(key))input.value=params.get(key);}if(params.has("ownerId"))document.querySelector("#back").href="/owners/"+encodeURIComponent(params.get("ownerId"));document.querySelector('form').addEventListener('submit',async event=>{event.preventDefault();const data=new FormData(event.target);const output=document.querySelector('output');try{const response=await fetch(`/api/${data.get('architecture')}/owners/${data.get('ownerId')}/pets/${data.get('pet')}/visits`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:data.get('date'),description:data.get('description')})});output.textContent=response.ok?'Besuch in der H2-Datenbank gespeichert.':(await response.json()).error;}catch{output.textContent='Server nicht erreichbar.';}});</script></html>
